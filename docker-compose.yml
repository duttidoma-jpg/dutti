version: '3.9'
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    expose:
      - "8080"
    depends_on:
      - db
      - redis
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    expose:
      - "3000"
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: radar
    volumes:
      - db-data:/var/lib/postgresql/data
  redis:
    image: redis:7
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
volumes:
  db-data:
