events {}
http {
  server {
    listen 80;
    location / {
      proxy_pass http://web:3000;
    }
    location /api/ {
      proxy_pass http://api:8080/;
    }
    location /ws/ {
      proxy_pass http://api:8080/ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
